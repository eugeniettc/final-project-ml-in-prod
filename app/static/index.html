<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PredictMaint AI — Maintenance Prédictive</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --accent: #38bdf8;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
        --success: #22c55e;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
      }

      .container {
        width: 100%;
        max-width: 800px;
      }

      header {
        text-align: center;
        margin-bottom: 2rem;
      }

      h1 {
        font-size: 2rem;
        color: var(--accent);
        margin-bottom: 0.5rem;
      }

      p.subtitle {
        color: var(--text-muted);
        font-size: 1rem;
      }

      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      }

      .sample-buttons {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }

      .btn-sample {
        flex: 1;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0f172a;
        color: var(--text-main);
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-sample:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }

      .btn-sample.healthy:hover {
        border-color: var(--success);
      }
      .btn-sample.failure:hover {
        border-color: var(--danger);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.25rem;
        margin-bottom: 1.5rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      label {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 500;
      }

      input,
      select {
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.6rem 0.8rem;
        color: var(--text-main);
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus,
      select:focus {
        border-color: var(--accent);
      }

      .btn-submit {
        width: 100%;
        padding: 0.85rem;
        background: var(--accent);
        color: #0f172a;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .btn-submit:hover {
        opacity: 0.9;
      }

      .result-box {
        display: none;
        margin-top: 1.5rem;
        padding: 1.25rem;
        border-radius: 8px;
        border-left: 6px solid;
        animation: fadeIn 0.3s ease-in-out;
      }

      .result-healthy {
        background: rgba(34, 197, 94, 0.1);
        border-color: var(--success);
      }

      .result-failure {
        background: rgba(239, 68, 68, 0.1);
        border-color: var(--danger);
      }

      .result-title {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .result-details {
        font-size: 0.95rem;
        color: var(--text-muted);
      }

      footer {
        margin-top: auto;
        text-align: center;
        font-size: 0.85rem;
        color: var(--text-muted);
        display: flex;
        gap: 1.5rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .badge {
        background: var(--border);
        padding: 0.25rem 0.6rem;
        border-radius: 4px;
        color: var(--text-main);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>⚙️ PredictMaint AI</h1>
        <p class="subtitle">
          Diagnostic de panne industrielle par Machine Learning
        </p>
      </header>

      <div class="card">
        <label style="margin-bottom: 0.6rem; display: block"
          >⚡ Préremplir avec un cas test pour l'évaluation :</label
        >
        <div class="sample-buttons">
          <button
            type="button"
            class="btn-sample healthy"
            onclick="loadSample('healthy')"
          >
            🟢 Exemple Machine Saine
          </button>
          <button
            type="button"
            class="btn-sample failure"
            onclick="loadSample('failure')"
          >
            🔴 Exemple Machine à Risque
          </button>
        </div>

        <form id="predictionForm" onsubmit="submitPrediction(event)">
          <div class="form-grid">
            <div class="form-group">
              <label for="type">Type de produit</label>
              <select id="type" required>
                <option value="L">L (Low quality - 50%)</option>
                <option value="M">M (Medium quality - 30%)</option>
                <option value="H">H (High quality - 20%)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="air_temperature">Température de l'air [K]</label>
              <input
                type="number"
                id="air_temperature"
                step="0.1"
                value="298.1"
                required
              />
            </div>
            <div class="form-group">
              <label for="process_temperature"
                >Température du process [K]</label
              >
              <input
                type="number"
                id="process_temperature"
                step="0.1"
                value="308.6"
                required
              />
            </div>
            <div class="form-group">
              <label for="rotational_speed">Vitesse de rotation [rpm]</label>
              <input
                type="number"
                id="rotational_speed"
                step="1"
                value="1500"
                required
              />
            </div>
            <div class="form-group">
              <label for="torque">Couple [Nm]</label>
              <input
                type="number"
                id="torque"
                step="0.1"
                value="40.0"
                required
              />
            </div>
            <div class="form-group">
              <label for="tool_wear">Usure de l'outil [min]</label>
              <input
                type="number"
                id="tool_wear"
                step="1"
                value="30"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn-submit" id="btnSubmit">
            Analyser l'état de la machine
          </button>
        </form>

        <div id="resultBox" class="result-box">
          <div id="resultTitle" class="result-title"></div>
          <div id="resultDetails" class="result-details"></div>
        </div>
      </div>

      <footer>
        <div>
          Modèle : <span id="modelName" class="badge">predictmaint-ai</span>
        </div>
        <div>
          Version chargée :
          <span id="modelVersion" class="badge">Vérification...</span>
        </div>
        <div>
          Alias de prod : <span id="modelAlias" class="badge">champion</span>
        </div>
      </footer>
    </div>

    <script>
      // Récupération des informations sur le modèle au chargement
      async function fetchModelInfo() {
        try {
          const res = await fetch("/model-info");
          if (res.ok) {
            const data = await res.json();
            document.getElementById("modelName").textContent = data.model_name;
            document.getElementById("modelVersion").textContent =
              "v" + data.model_version;
            document.getElementById("modelAlias").textContent = data.alias;
          } else {
            document.getElementById("modelVersion").textContent =
              "Non disponible (503)";
          }
        } catch (e) {
          document.getElementById("modelVersion").textContent = "Hors ligne";
        }
      }

      // Chargement des exemples de test
      function loadSample(type) {
        if (type === "healthy") {
          document.getElementById("type").value = "L";
          document.getElementById("air_temperature").value = 298.1;
          document.getElementById("process_temperature").value = 308.6;
          document.getElementById("rotational_speed").value = 1550;
          document.getElementById("torque").value = 35.0;
          document.getElementById("tool_wear").value = 25;
        } else {
          // Paramètres critiques provoquant une panne
          document.getElementById("type").value = "L";
          document.getElementById("air_temperature").value = 304.5;
          document.getElementById("process_temperature").value = 313.8;
          document.getElementById("rotational_speed").value = 1200;
          document.getElementById("torque").value = 75.0;
          document.getElementById("tool_wear").value = 240;
        }
      }

      // Soumission du formulaire
      async function submitPrediction(event) {
        event.preventDefault();
        const btn = document.getElementById("btnSubmit");
        const resultBox = document.getElementById("resultBox");
        const resultTitle = document.getElementById("resultTitle");
        const resultDetails = document.getElementById("resultDetails");

        btn.disabled = true;
        btn.textContent = "Calcul en cours...";

        const payload = {
          type: document.getElementById("type").value,
          air_temperature: parseFloat(
            document.getElementById("air_temperature").value,
          ),
          process_temperature: parseFloat(
            document.getElementById("process_temperature").value,
          ),
          rotational_speed: parseFloat(
            document.getElementById("rotational_speed").value,
          ),
          torque: parseFloat(document.getElementById("torque").value),
          tool_wear: parseFloat(document.getElementById("tool_wear").value),
        };

        try {
          const response = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const data = await response.json();

          if (response.ok) {
            resultBox.style.display = "block";
            const percentage = (data.risk_score * 100).toFixed(1);

            if (data.failure_prediction === 1) {
              resultBox.className = "result-box result-failure";
              resultTitle.textContent = "⚠️ Risque de panne détecté !";
              resultDetails.innerHTML = `Score de risque : <strong>${percentage}%</strong><br>Le modèle préconise une inspection immédiate de l'outil.<br><small>(Prédiction effectuée par ${data.model_name} v${data.model_version})</small>`;
            } else {
              resultBox.className = "result-box result-healthy";
              resultTitle.textContent = "✅ Machine en état nominal";
              resultDetails.innerHTML = `Score de risque : <strong>${percentage}%</strong><br>Aucune anomalie détectée pour ces conditions de fonctionnement.<br><small>(Prédiction effectuée par ${data.model_name} v${data.model_version})</small>`;
            }
          } else {
            resultBox.style.display = "block";
            resultBox.className = "result-box result-failure";
            resultTitle.textContent = "Erreur " + response.status;
            resultDetails.textContent = data.detail
              ? JSON.stringify(data.detail)
              : "Erreur lors du calcul.";
          }
        } catch (error) {
          resultBox.style.display = "block";
          resultBox.className = "result-box result-failure";
          resultTitle.textContent = "Erreur de connexion";
          resultDetails.textContent = "Impossible de joindre le serveur API.";
        } finally {
          btn.disabled = false;
          btn.textContent = "Analyser l'état de la machine";
        }
      }

      // Initialisation
      window.onload = fetchModelInfo;
    </script>
  </body>
</html>
