
name: PredictMaint - Staging Deployment

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predictmaint-staging
  cancel-in-progress: false

jobs:
  validate:
    name: Validate staging release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python syntax checks
        run: python -m compileall -q app ml tests

      - name: Ruff critical checks
        run: python -m ruff check app ml tests --select E9,F63,F7,F82

      - name: Automated tests
        env:
          ENABLE_MOCK_MODEL: "true"
        run: python -m pytest tests/ -v

      - name: Build Docker image
        run: docker build -t predictmaint-ai:staging .

      - name: Start Docker container
        run: |
          docker run -d \
            --name predictmaint-staging-test \
            -p 8000:8000 \
            -e ENABLE_MOCK_MODEL=true \
            predictmaint-ai:staging

      - name: Docker smoke test
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/ready; then
              curl -fsS http://localhost:8000/model-info
              exit 0
            fi
            sleep 2
          done

          docker logs predictmaint-staging-test
          exit 1

      - name: Docker logs on failure
        if: failure()
        run: docker logs predictmaint-staging-test || true

      - name: Cleanup Docker container
        if: always()
        run: docker rm -f predictmaint-staging-test || true

  deploy-staging:
    name: Deploy and verify Render staging
    runs-on: ubuntu-latest
    needs: validate

    if: >-
      github.repository == 'eugeniettc/final-project-ml-in-prod' &&
      github.ref == 'refs/heads/staging'

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Missing Render staging deploy hook"
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            "${RENDER_DEPLOY_HOOK}&ref=${DEPLOY_SHA}"

          echo "Render staging deployment requested."
          echo "Requested Git SHA: ${DEPLOY_SHA}"

      - name: Verify public application
        env:
          STAGING_URL: https://predictmaint-ai-staging.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.request import Request, urlopen

          base = os.environ["STAGING_URL"]

          def request_json(path, payload=None):
              body = (
                  json.dumps(payload).encode("utf-8")
                  if payload is not None else None
              )
              headers = (
                  {"Content-Type": "application/json"}
                  if body is not None else {}
              )
              req = Request(
                  base + path,
                  data=body,
                  headers=headers,
                  method="POST" if body else "GET",
              )
              with urlopen(req, timeout=25) as response:
                  assert response.status == 200
                  return json.load(response)

          for attempt in range(40):
              try:
                  ready = request_json("/ready")
                  info = request_json("/model-info")

                  assert ready["status"] == "ready"
                  assert info["status"] == "loaded"
                  assert info["model_version"].isdigit()
                  assert ready["loaded_version"] == info["model_version"]
                  assert info["alias"] == "champion"

                  payload = {
                      "type": "L",
                      "air_temperature": 298.1,
                      "process_temperature": 308.6,
                      "rotational_speed": 1500,
                      "torque": 40,
                      "tool_wear": 20,
                  }

                  prediction = request_json("/predict", payload)

                  assert prediction["failure_prediction"] in (0, 1)
                  assert 0 <= prediction["risk_score"] <= 1
                  assert prediction["model_version"] == info["model_version"]

                  print("Public staging smoke tests PASSED!")
                  print("Loaded MLflow version:", info["model_version"])
                  break

              except Exception as exc:
                  print(f"Attempt {attempt + 1}/40: {exc}")
                  if attempt == 39:
                      raise
                  time.sleep(15)
          PY
