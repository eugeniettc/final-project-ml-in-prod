
name: PredictMaint - Continuous Training

on:
  push:
    branches:
      - feature/continuous-training

  pull_request:
    branches:
      - dev

  workflow_dispatch:
    inputs:
      dataset_version:
        description: "Dataset version to validate"
        required: true
        type: choice
        default: v2
        options:
          - v1
          - v2

permissions:
  contents: read

jobs:
  ml-tests:
    name: ML automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q ml

      - name: Run automated ML tests
        run: python -m pytest tests/ -v


  # ============================================
  # 2. DVC / AZURE DATA VALIDATION
  # ============================================

  data-validation:
    name: DVC Azure data validation
    runs-on: ubuntu-latest
    needs: ml-tests

    if: >-
      github.repository == 'eugeniettc/final-project-ml-in-prod' &&
      github.ref == 'refs/heads/feature/continuous-training' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Pull datasets from Azure with DVC
        env:
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
        run: |
          if [ -z "$AZURE_STORAGE_SAS_TOKEN" ]; then
            echo "::error::Azure SAS token is missing"
            exit 1
          fi

          dvc pull -r myazure
          dvc status

      - name: Validate dataset v1
        if: github.event_name == 'push' || inputs.dataset_version == 'v1'
        run: |
          python -m ml.retrain --dataset-version v1 --validate-only

      - name: Validate dataset v2
        if: github.event_name == 'push' || inputs.dataset_version == 'v2'
        run: |
          python -m ml.retrain --dataset-version v2 --validate-only

      - name: Confirm all datasets are available
        run: |
          test -f data/releases/v1/train.csv
          test -f data/releases/v2/train.csv
          test -f data/splits/validation.csv
          test -f data/splits/test.csv

          echo "All required datasets are available."


  # ============================================
  # 3. MLFLOW MODEL REGISTRY VERIFICATION
  # ============================================

  mlflow-registry-check:
    name: MLflow champion verification
    runs-on: ubuntu-latest
    needs: [ml-tests, data-validation]

    if: >-
      github.repository == 'eugeniettc/final-project-ml-in-prod' &&
      github.ref == 'refs/heads/feature/continuous-training' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
       
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install MLflow
        run: |
          python -m pip install --upgrade pip
          python -m pip install mlflow

      - name: Verify champion in MLflow Registry
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/Abdel380/predictmaint-ai.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ vars.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from mlflow import MlflowClient

          if not os.getenv("MLFLOW_TRACKING_PASSWORD"):
              raise RuntimeError("DAGSHUB_TOKEN is missing")

          MODEL_NAME = "predictmaint-ai"

          print("\n=== MLFLOW REGISTRY VERIFICATION ===")

          client = MlflowClient()

          champion = client.get_model_version_by_alias(
              MODEL_NAME,
              "champion",
          )

          print("Model:", champion.name)
          print("Champion version:", champion.version)
          print("Status:", champion.status)

          if champion.status != "READY":
              raise RuntimeError("Champion is not READY")

          print("\nMLFLOW CHAMPION VERIFICATION PASSED!")
          print("Registry was not modified.")
          PY

  # ============================================
  # 4. CONTROLLED CONTINUOUS TRAINING DRY-RUN
  # ============================================

  ct-dry-run:
    name: Continuous Training dry-run
    runs-on: ubuntu-latest
    needs: [data-validation, mlflow-registry-check]

    if: >-
      github.repository == 'eugeniettc/final-project-ml-in-prod' &&
      github.ref == 'refs/heads/feature/continuous-training' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[run-ct-dry-run]')
        )
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download training data
        env:
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
        run: dvc pull -r myazure

      - name: Train and evaluate candidate
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/Abdel380/predictmaint-ai.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ vars.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DATASET_VERSION: ${{ inputs.dataset_version || 'v2' }}
        run: |
          python -m ml.retrain --dataset-version "$DATASET_VERSION"
